[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow    = "1"
thiserror = "2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
tracing   = "0.1"

# A smaller, faster release binary. Not `panic = "abort"`: Tokio contains a
# panic inside the task that raised it, and the resident app (reminders, the
# tray) keeps running; with abort, any task's panic would end the process.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
