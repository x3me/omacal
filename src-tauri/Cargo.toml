[package]
name = "omacal"
version = "1.8.0"
description = "A minimal desktop Google Calendar client for Omarchy Linux"
authors = ["Extreme Labs"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omacal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# One-click update, offered only when the process is an AppImage (update.rs):
# the one channel where the running binary is a single user-writable file.
# Packaged installs (deb/rpm/AUR/flatpak) keep the notice-only banner.
tauri-plugin-updater = "2"
# Start on login (spec §2.6). Never enabled in demo mode — a synthetic-data
# build launching itself on someone's machine is a nasty surprise.
tauri-plugin-autostart = "2"
serde.workspace = true
serde_json.workspace = true
toml = "1"
tracing.workspace = true
omacal-core = { version = "0.1.0", path = "../crates/omacal-core" }
omacal-store = { version = "0.1.0", path = "../crates/omacal-store" }
omacal-caldav = { version = "0.1.0", path = "../crates/omacal-caldav" }
omacal-google = { version = "0.1.0", path = "../crates/omacal-google" }
reqwest = { version = "0.12", features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots"], default-features = false }
omacal-sync = { version = "0.1.0", path = "../crates/omacal-sync" }
jiff = "0.2.35"
uuid = { version = "1", features = ["v4"] }
keyring = "4.1.6"
open = "5.4.0"
tracing-subscriber = "0.3.23"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
# `net` + `io-util` joined for the CLI write socket (ipc.rs): a Unix
# listener and buffered line reads, nothing more.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
anyhow.workspace = true
thiserror.workspace = true
# The *file watcher* for live theme reload. Not `notify-rust`, which is the
# D-Bus notification client below and is a different crate entirely.
notify = "8.2.0"

# Omarchy's notification transport. D-Bus rather than the Tauri plugin because
# only this one has action buttons, and Join/Snooze are half the feature.
[target.'cfg(unix)'.dependencies]
# The CLI's SIGPIPE reset (cli.rs): Rust ignores the signal, so `omacal
# agenda | head` panics mid-print without it. Already in the tree many
# times over transitively; this only adds the right to name it.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
# WebKitGTK draws form-control popups — the <select> menu, the date
# picker — with the GTK theme, not the page's color-scheme, so a dark
# palette must also be declared to GTK (lib.rs::apply_gtk_dark_hint) or
# those popups flash white. Already in the tree via tauri; same major.
gtk = "0.18"
# The suspend watcher's bus client (resume.rs). Already in the tree twice —
# notify-rust and the keyring's secret-service both ride zbus — so pinning
# the same major adds no new compilation, only the right to import it.
zbus = "5"
futures-util = { version = "0.3", default-features = false }

# macOS. The objc2 quartet is the real transport (notify_mac.rs):
# UNUserNotificationCenter with registered action categories and a click
# delegate — possible since v0.5.0 made the bundle signed, which is that
# API's entry fee. The Tauri plugin stays as the fallback for unbundled
# runs (`cargo tauri dev`), where the centre throws instead of answering;
# there it remains best-effort exactly as spec §2.4 originally accepted.
# Features are the crate's per-header gates: each names the one class it
# unlocks, plus `block2` for every completion-handler-taking method.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notification = "2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSString", "NSArray", "NSSet", "NSError", "NSBundle", "NSObject",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std", "block2", "bitflags",
    "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest",
    "UNNotificationTrigger", "UNNotificationAction", "UNNotificationCategory",
    "UNNotificationResponse", "UNNotification",
] }

[dev-dependencies]
wiremock = "0.6.5"
# The skill installer's tests own a throwaway $HOME each (cli_skill.rs).
tempfile = "3"

