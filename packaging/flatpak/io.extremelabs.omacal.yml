# The Flatpak build — the distro-agnostic install path, and the only channel
# that reports back how many people actually run this (Flathub publishes
# per-app install counts; the GitHub asset counter cannot tell an update from
# a new user, and pkgstats-style sampling is muddier still).
#
# Repackages the official release .deb rather than building from source, for
# exactly the reason packaging/aur/PKGBUILD does: release artifacts carry the
# app's Google OAuth client pair, embedded at release-build time
# (docs/distribution.md §1). A source build here would produce a binary that
# cannot sign in without the user creating their own Cloud project — the
# experience this package exists to remove. See README.md in this directory
# for what that means for a Flathub submission specifically.
#
# The app id is *not* the Tauri identifier. `com.omacal.app` claims a domain
# nobody here owns, and Flathub requires an id whose domain the publisher
# controls; extremelabs.io is the same domain Google verification already
# points at. The Tauri identifier stays as it is — changing it would move
# every existing user's data directory.
id: io.extremelabs.omacal
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: omacal

finish-args:
  # Wayland first, X11 as the fallback. --share=ipc is what makes X11 shared
  # memory work; without it the fallback path is unusably slow.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # WebKitGTK composites on the GPU.
  - --device=dri
  # Two things need the network, not one: calendar sync, and the loopback
  # listener that the Google OAuth redirect lands on.
  - --share=network
  # The keyring. Sign-in tokens live in the Secret Service and never on disk,
  # so without this the app can start but can never stay signed in.
  - --talk-name=org.freedesktop.secrets
  # Invitation notifications, which carry actions rather than just text.
  - --talk-name=org.freedesktop.Notifications
  # The tray icon, via whichever StatusNotifierItem host the desktop runs.
  - --talk-name=org.kde.StatusNotifierWatcher
  # tauri-plugin-single-instance claims `<tauri identifier>.SingleInstance` on
  # the session bus, and that identifier is not this app id — so the sandbox
  # denies it by default. Without this line every launch starts a second copy
  # and the tray's Open / Sync actions never reach the running one.
  # Sync on resume. The watcher subscribes to logind's PrepareForSleep on the
  # *system* bus, which a sandbox cannot see at all by default — without this
  # the app logs "suspend watcher unavailable" at startup and every lid-close
  # leaves the calendar stale until something else nudges it, which on a
  # laptop is every morning (see src-tauri/src/resume.rs).
  - --system-talk-name=org.freedesktop.login1
  # `~/.config/omacal/config.toml` is read from $HOME directly, and $HOME
  # inside the sandbox is a tmpfs that empties on exit. Persist just that one
  # directory so the power-user override (own Cloud credentials,
  # docs/distribution.md §1) has somewhere durable to live — it lands in
  # ~/.var/app/io.extremelabs.omacal/.config/omacal/ on the host.
  - --persist=.config/omacal

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gtk-doc
  - '*.la'
  - '*.a'

modules:
  # The tray. omacal dlopens libayatana-appindicator3.so.1 first and
  # libappindicator3.so.1 second; what follows builds the former, which is
  # the maintained half of that pair. Not optional in practice: closing the
  # window only hides omacal, so a build with no tray leaves a running app
  # with no way back to it.
  #
  # shared-modules has a libappindicator recipe that would cover this in one
  # line, but it drags in dbus-glib from dbus.freedesktop.org — a host with
  # no mirror in that recipe, and unreachable on the day this was written.
  # The Ayatana stack needs neither dbus-glib nor libindicator, and is four
  # modules of CMake rather than five of 2013 autotools.
  - shared-modules/intltool/intltool-0.51.json

  - name: libdbusmenu
    # The one piece with no modern successor: libayatana-appindicator still
    # links dbusmenu-gtk3-0.4. Options lifted from the shared-modules recipe,
    # valgrind variables included — its configure gets that check wrong and
    # fails without them.
    build-options:
      cflags: -Wno-error
      env:
        HAVE_VALGRIND_FALSE: '#'
        HAVE_VALGRIND_TRUE: ''
    config-opts:
      - --disable-static
      - --disable-gtk-doc
      - --enable-introspection=no
      - --disable-vala
      - --disable-dumper
      - --disable-tests
      - --with-gtk=3
    cleanup:
      - /libexec
      - /share/doc
      - /share/libdbusmenu
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a

  - name: ayatana-ido
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_TESTS=OFF
      - -DENABLE_WERROR=OFF
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/ayatana-ido/archive/refs/tags/0.10.4.tar.gz
        sha256: bd59abd5f1314e411d0d55ce3643e91cef633271f58126be529de5fb71c5ab38

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_TESTS=OFF
      - -DENABLE_WERROR=OFF
      - -DFLAVOUR_GTK3=ON
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-indicator/archive/refs/tags/0.9.5.tar.gz
        sha256: 73d71c908b803f12e4a5ecd8392511b58afbdd0c82ad7909611a17bb7847c5c8

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_TESTS=OFF
      - -DENABLE_WERROR=OFF
      - -DENABLE_GTKDOC=OFF
      - -DENABLE_BINDINGS_MONO=OFF
      - -DENABLE_BINDINGS_VALA=OFF
      - -DFLAVOUR_GTK3=ON
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-appindicator/archive/refs/tags/0.6.0.tar.gz
        sha256: 23be92ad8eb9625ce93b23b14f82f3cf88a4970c31d48581945ddfbac0441d06

  - name: omacal
    buildsystem: simple
    build-commands:
      # flatpak-builder has no .deb archive type, so unpack it by hand.
      - ar x omacal.deb
      # Glob the payload: the bundler ships gzip today, and a switch to xz or
      # zstd would otherwise break this line silently.
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/omacal /app/bin/omacal
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/omacal.png /app/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/omacal.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      # The Tauri bundler labels this one `256x256@2` while shipping 256 real
      # pixels, which is a 128@2x icon under the wrong name. Install it where
      # its pixel count says it belongs.
      - install -Dm644 'usr/share/icons/hicolor/256x256@2/apps/omacal.png' /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      # The vector icon and the 512px raster (issue #39): what a launcher
      # scales up from otherwise is the 256px one, and it shows.
      - install -Dm644 usr/share/icons/hicolor/scalable/apps/omacal.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 usr/share/icons/hicolor/512x512/apps/omacal.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      # The .deb's own desktop entry carries an empty Categories= and an
      # unprefixed name, so ship a proper one rather than patching that.
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        url: https://github.com/x3me/omacal/releases/download/v1.8.0/omacal_1.8.0_amd64.deb
        sha256: f950a6e49f58f63283fca88d13f262572f24b39e0748d56f8a7bf6cfd822d135
        dest-filename: omacal.deb
        # flatpak-external-data-checker reads this and opens the version-bump
        # pull request by itself once the app is on Flathub. Until then,
        # ./bump.sh in this directory does the same job locally.
        x-checker-data:
          type: json
          url: https://api.github.com/repos/x3me/omacal/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '.assets[] | select(.name == "omacal_" + $version + "_amd64.deb") | .browser_download_url'
      - type: file
        path: io.extremelabs.omacal.desktop
      - type: file
        path: io.extremelabs.omacal.metainfo.xml
